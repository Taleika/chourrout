<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar | Chourrout Hnos.</title>
  <style>
    :root{--red:#f01616;--black:#111;--gray:#f4f4f4;--line:#e4e4e4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#111;padding:24px}
    .login{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 18px 45px rgba(0,0,0,.08)}
    .brand{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:4px solid var(--red)}
    .ch{font-size:44px;font-weight:900;color:var(--red);letter-spacing:-6px;line-height:.8}.name{font-size:24px;font-weight:900}.sub{font-size:12px;color:#777;margin-top:4px}
    h1{font-size:26px;margin:28px 0 8px}p{color:#666;line-height:1.5;margin:0 0 22px}.btn{width:100%;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:15px;padding:14px 18px;cursor:pointer}.btn:hover{background:#222}.btn:disabled{opacity:.55;cursor:wait}
    .hint{margin-top:18px;background:#f7f7f7;border-radius:12px;padding:12px 14px;font-size:12px;color:#666}.error{display:none;margin-top:14px;background:#fff1f1;color:#9b1111;border:1px solid #ffd3d3;border-radius:10px;padding:10px 12px;font-size:13px}.status{margin-top:13px;text-align:center;color:#777;font-size:12px}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><div class="ch">CH</div><div><div class="name">Chourrout Hnos.</div><div class="sub">Sistema de presupuestos</div></div></div>
    <h1>Ingresar al sistema</h1>
    <p>Acceso privado para usuarios autorizados. Iniciá sesión con la cuenta de Google habilitada.</p>
    <button class="btn" id="loginGoogle">Ingresar con Google</button>
    <div class="error" id="errorLogin"></div>
    <div class="status" id="estadoLogin">Verificando sesión…</div>
    <div class="hint">El sistema solo permite cuentas previamente autorizadas por Chourrout Hnos.</div>
  </main>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { iniciarSesionGoogle, autorizado } from './js/auth.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';

    const btn=document.getElementById('loginGoogle');
    const error=document.getElementById('errorLogin');
    const estado=document.getElementById('estadoLogin');
    const params=new URLSearchParams(location.search);
    const destino=params.get('return') || 'index.html';

    function mostrarError(msg){error.textContent=msg;error.style.display='block';estado.textContent='';}
    function ir(){location.replace(destino);}

    onAuthStateChanged(auth,user=>{
      if(autorizado(user)){estado.textContent=`Sesión iniciada como ${user.email}`;setTimeout(ir,250);}
      else estado.textContent='Listo para ingresar.';
    });

    btn.addEventListener('click',async()=>{
      error.style.display='none';btn.disabled=true;btn.textContent='Abriendo Google…';
      try{await iniciarSesionGoogle();ir();}
      catch(e){mostrarError(e?.message || 'No se pudo iniciar sesión.');btn.disabled=false;btn.textContent='Ingresar con Google';}
    });
  </script>
</body>
</html>
